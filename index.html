<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" id="tc" content="#000000">
<script>document.documentElement.dataset.theme="dark"</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kaca Musik">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Kaca Musik</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: tiga panel kaca (pustaka, pemutar, lirik) di desktop; satu panel per tab di ponsel, dengan tab bar dan mini player kaca mengambang. */
@property --c1{syntax:'<color>';inherits:true;initial-value:#7a5cff}
@property --c2{syntax:'<color>';inherits:true;initial-value:#ff5a8f}
@property --c3{syntax:'<color>';inherits:true;initial-value:#2ec5ff}

:root{
  --c1:#7a5cff; --c2:#ff5a8f; --c3:#2ec5ff;
  --bg:#000; --fg:#f6f7ff; --fg2:rgba(246,247,255,.66); --fg3:rgba(246,247,255,.4);
  --g1:rgba(255,255,255,.13); --g2:rgba(255,255,255,.035);
  --stroke:rgba(255,255,255,.15); --hi:rgba(255,255,255,.34);
  --rim1:rgba(255,255,255,.7); --rim2:rgba(255,255,255,.22);
  --shadow:rgba(0,0,0,.7); --track:rgba(255,255,255,.2);
  --accent:#ff4d79; --orb:.42; --veil:rgba(0,0,0,.5); --art:.4;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Figtree",system-ui,sans-serif;
  color-scheme:dark;
  transition:--c1 1s ease,--c2 1s ease,--c3 1s ease;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;box-sizing:border-box;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
body{
  height:100%;height:100dvh;padding-block:12px;overscroll-behavior:none;touch-action:manipulation;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

/* ---------- latar bergerak ---------- */
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.orb{position:absolute;border-radius:50%;opacity:var(--orb);will-change:transform}
.o1{width:75vmax;height:75vmax;left:-28vmax;top:-30vmax;background:radial-gradient(circle,var(--c1) 0,transparent 62%);animation:d1 28s ease-in-out infinite alternate}
.o2{width:70vmax;height:70vmax;right:-30vmax;top:10vmax;background:radial-gradient(circle,var(--c2) 0,transparent 62%);animation:d2 34s ease-in-out infinite alternate}
.o3{width:65vmax;height:65vmax;left:5vmax;bottom:-38vmax;background:radial-gradient(circle,var(--c3) 0,transparent 62%);animation:d3 30s ease-in-out infinite alternate}
.bg::after{content:"";position:absolute;inset:0;background:var(--veil)}
.art{position:absolute;inset:-14%;background-size:cover;background-position:center;opacity:0;filter:blur(46px) saturate(1.55);transform:scale(1.15);transition:opacity 1.3s ease;will-change:opacity}
.art.show{opacity:var(--art,.4)}
.bg.has-art .orb{opacity:calc(var(--orb)*.25)}
@keyframes d1{to{transform:translate(18vmax,14vmax) scale(1.15)}}
@keyframes d2{to{transform:translate(-20vmax,12vmax) scale(.9)}}
@keyframes d3{to{transform:translate(16vmax,-16vmax) scale(1.2)}}

/* ---------- kaca ---------- */
.glass{
  position:relative;isolation:isolate;
  background:linear-gradient(140deg,var(--g1),var(--g2));
  -webkit-backdrop-filter:blur(24px) saturate(180%) brightness(1.05);
  backdrop-filter:blur(24px) saturate(180%) brightness(1.05);
  border:1px solid var(--stroke);
  box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 rgba(255,255,255,.07),inset 0 0 26px rgba(255,255,255,.05),0 28px 60px -24px var(--shadow);
}
.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(155deg,var(--rim1),transparent 32%,transparent 68%,var(--rim2));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}
.glass::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(260px circle at var(--mx,30%) var(--my,0%),rgba(255,255,255,.26),transparent 62%);
  opacity:0;transition:opacity .45s;
}
.glass:hover::after{opacity:1}

/* ---------- kerangka ---------- */
.app{
  position:relative;z-index:1;height:100%;margin:0 auto;max-width:560px;
  display:grid;grid-template-columns:minmax(0,1fr);gap:14px;
  padding-bottom:calc(var(--dock,86px) + env(safe-area-inset-bottom,0px));
}
.app.has-mini{--dock:160px}
.panel{display:none;flex-direction:column;min-height:0;min-width:0;border-radius:34px;overflow:hidden}
.app[data-tab="library"] #libPanel,
.app[data-tab="queue"] #queuePanel,
.app[data-tab="player"] #playerPanel,
.app[data-tab="lyrics"] #lyricsPanel{display:flex;z-index:3}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}}
@keyframes popm{from{opacity:0;transform:translateX(-50%) translateY(10px) scale(.985)}}

.phead{display:flex;align-items:center;gap:12px;padding:20px 20px 10px}
.phead h1,.phead h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.phead .sub{display:block;margin-top:3px;font-size:13px;font-weight:500;color:var(--fg2);letter-spacing:0}
.grow{flex:1;min-width:0}

/* ---------- tombol ---------- */
.ib{
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--fg2);
  transition:transform .45s cubic-bezier(.32,.72,0,1),background .25s,color .25s;
}
.ib svg{width:22px;height:22px}
.ib:hover{background:rgba(255,255,255,.14);color:var(--fg)}
.ib:active{transform:scale(.88)}
.ib.on{color:var(--accent)}
.ib.lg svg{width:30px;height:30px}
.ib.lg{color:var(--fg)}
.fab{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--fg);transition:transform .45s cubic-bezier(.32,.72,0,1)}
.fab:hover{transform:scale(1.08)}
.fab:active{transform:scale(.9)}
.fab svg{width:22px;height:22px}

/* ---------- pustaka ---------- */
.tools{padding:4px 18px 10px;display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:8px;height:44px;border-radius:22px;padding:0 14px;background:rgba(255,255,255,.1);border:1px solid var(--stroke)}
.search svg{width:18px;height:18px;color:var(--fg3);flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;height:100%}
.search input::placeholder{color:var(--fg3)}
.seg{display:flex;gap:4px;padding:4px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid var(--stroke)}
.seg button{flex:1;height:32px;border-radius:16px;font-size:13px;font-weight:600;color:var(--fg2);transition:all .35s cubic-bezier(.32,.72,0,1)}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.22);color:var(--fg);box-shadow:inset 0 1px 0 var(--hi),0 6px 16px -8px var(--shadow)}
.list{list-style:none;margin:0;padding:4px 10px 18px;overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:2px}
.add-row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px;border-radius:22px;margin-bottom:6px;
  border:1.5px dashed var(--stroke);color:var(--fg2);transition:background .3s,transform .4s cubic-bezier(.32,.72,0,1);
}
.add-row:hover{background:rgba(255,255,255,.1);color:var(--fg)}
.add-row:active{transform:scale(.98)}
.add-row .plus{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:rgba(255,255,255,.12);flex:none}
.add-row b{display:block;color:var(--fg);font-size:15px}
.add-row span{font-size:12.5px}
.it{
  display:flex;align-items:center;gap:12px;padding:8px 8px 8px 10px;border-radius:22px;cursor:pointer;
  transition:background .3s,transform .4s cubic-bezier(.32,.72,0,1);
}
.it:hover{background:rgba(255,255,255,.1)}
.it:active{transform:scale(.98)}
.it.on{background:rgba(255,255,255,.17);box-shadow:inset 0 1px 0 var(--hi)}
.th{width:52px;height:52px;border-radius:14px;object-fit:cover;flex:none;background:rgba(255,255,255,.1)}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.meta b{font-weight:650;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{font-size:13px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:3px 7px;border-radius:8px;background:rgba(255,255,255,.16);color:var(--fg2);flex:none}
.eq{display:none;gap:2px;align-items:flex-end;height:16px;flex:none}
.eq i{width:3px;background:var(--accent);border-radius:2px;height:30%;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.75s}
.it.on .eq{display:flex}
.app:not(.playing) .eq i{animation-play-state:paused}
@keyframes eq{50%{height:100%}}
.none{padding:30px 18px;text-align:center;color:var(--fg2)}

/* ---------- pemutar ---------- */
.player{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:18px;padding:22px 26px 26px}
.cover{
  width:min(100%,340px);aspect-ratio:1;border-radius:30px;overflow:hidden;flex:none;position:relative;
  border:1px solid rgba(255,255,255,.28);
  transform:scale(.84);box-shadow:0 18px 36px -18px rgba(0,0,0,.6);
  transition:transform .8s cubic-bezier(.32,.72,0,1),box-shadow .8s;
}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.28),transparent 40%);pointer-events:none}
.app.playing .cover{transform:scale(1);box-shadow:0 44px 80px -26px color-mix(in srgb,var(--c1) 75%,#000)}
.ttl{width:100%;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.ttl h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.15;text-wrap:balance}
.ttl p{margin:0;color:var(--fg2);font-size:16px;font-weight:500}
.chip{display:inline-block;align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:10px;background:rgba(255,255,255,.18);color:var(--fg2);margin-bottom:4px}
.seekbox{width:100%}
.times{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--fg2);margin-top:6px;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:none;margin:0;cursor:pointer;--p:0%;touch-action:pan-y;display:block}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:linear-gradient(to right,var(--fg) var(--p),var(--track) var(--p));transition:height .3s cubic-bezier(.32,.72,0,1)}
input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:var(--track)}
input[type=range]::-moz-range-progress{height:8px;border-radius:8px;background:var(--fg)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-5px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 10px rgba(0,0,0,.45);transition:width .35s cubic-bezier(.32,.72,0,1),height .35s cubic-bezier(.32,.72,0,1),margin-top .35s cubic-bezier(.32,.72,0,1)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.45)}
input[type=range]:active::-webkit-slider-thumb{width:28px;height:28px;margin-top:-8px}
input[type=range]:active::-webkit-slider-runnable-track{height:12px;border-radius:12px}
.ctrls{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:340px}
.play{
  width:78px;height:78px;border-radius:50%;display:grid;place-items:center;color:var(--fg);
  transition:transform .5s cubic-bezier(.32,.72,0,1);
}
.play svg{width:34px;height:34px}
.play:hover{transform:scale(1.06)}
.play:active{transform:scale(.9)}
.vol{display:flex;align-items:center;gap:10px;width:100%;max-width:340px;color:var(--fg2)}
.vol svg{width:18px;height:18px;flex:none}

/* ---------- lirik ---------- */
.lsrc{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:10px;background:rgba(255,255,255,.16);color:var(--fg2);white-space:nowrap}
.lyr-body{
  position:relative;flex:1;min-height:0;overflow-y:auto;padding:14px 26px max(160px,50dvh);
  -webkit-mask-image:linear-gradient(transparent,#000 5%,#000 88%,transparent);
  mask-image:linear-gradient(transparent,#000 5%,#000 88%,transparent);
  scrollbar-width:none;
}
.lyr-body::-webkit-scrollbar{display:none}
.ln{
  --d:0;font-size:clamp(25px,6.4vw,34px);font-weight:750;line-height:1.2;letter-spacing:-.025em;padding:.32em 0;
  transform-origin:0 60%;opacity:.9;text-wrap:pretty;
  transition:opacity .55s,filter .55s,transform .7s cubic-bezier(.32,.72,0,1),text-shadow .6s;
}
.ln.gap{letter-spacing:.2em;color:var(--fg2)}
.synced .ln{
  cursor:pointer;
  opacity:calc(1 - min(var(--d),5)*.17);
  filter:blur(calc(min(var(--d),4)*.9px));
  transform:scale(calc(1 - min(var(--d),1)*.07));
}
.synced .ln:hover{opacity:.85;filter:none}
.synced .ln.on{text-shadow:0 0 34px color-mix(in srgb,var(--c1) 60%,transparent)}
.empty{max-width:340px;margin:0 auto;display:flex;flex-direction:column;gap:14px;align-items:flex-start;color:var(--fg2);font-size:15px;line-height:1.5}
.empty strong{color:var(--fg);font-size:20px;letter-spacing:-.02em}
.pill{
  display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:21px;font-weight:650;font-size:14px;color:var(--fg);
  transition:transform .45s cubic-bezier(.32,.72,0,1);
}
.pill:active{transform:scale(.94)}
.pill svg{width:18px;height:18px}
.pill.main{background:var(--fg);color:var(--bg);box-shadow:0 10px 24px -10px var(--shadow)}
.pill.warn{color:#ff6b6b}

/* ---------- tab bar & mini player ---------- */
.tabbar,.mini{
  position:fixed;left:50%;transform:translateX(-50%);z-index:5;width:min(440px,calc(100% - 32px));
}
.tabbar{
  bottom:calc(14px + env(safe-area-inset-bottom,0px));height:66px;border-radius:33px;padding:6px;
  display:grid;grid-template-columns:repeat(4,var(--tw,1fr));
}
.pillbg{
  position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);border-radius:calc(var(--tb)/2 - 6px);z-index:0;pointer-events:none;
  transform:translate3d(100%,0,0);transform-origin:50% 50%;will-change:transform;contain:layout style;
  background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.1) 55%,rgba(255,255,255,.18)),color-mix(in srgb,var(--dom) 32%,rgba(255,255,255,.06));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.36),inset 0 9px 14px -9px rgba(255,255,255,.6),inset 0 -8px 14px -10px rgba(255,255,255,.28),0 10px 24px -12px var(--dom);
  transition:box-shadow .28s,opacity .28s,background .6s;
}
.tabbar.lifted .pillbg{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55),inset 0 12px 16px -10px rgba(255,255,255,.8),inset 0 -12px 16px -10px rgba(255,255,255,.45),0 16px 32px -12px var(--dom)}
.tabbar{touch-action:none;user-select:none;-webkit-user-select:none}
.tabbar::after{display:none}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--fg2);font-size:11px;font-weight:650;border-radius:27px;transition:color .3s,transform .4s cubic-bezier(.32,.72,0,1)}
.tab svg{width:23px;height:23px}
.tab.hot{color:var(--fg)}
.tab:active{transform:scale(.92)}
.mini{
  bottom:calc(14px + 66px + 10px + env(safe-area-inset-bottom,0px));height:64px;border-radius:32px;padding:6px 10px 6px 6px;
  display:none;align-items:center;gap:10px;cursor:pointer;
}
.app.has-mini ~ .mini{display:flex;animation:popm .5s cubic-bezier(.32,.72,0,1)}
.mini .th{width:50px;height:50px;border-radius:25px}
.mini .meta b{font-size:14.5px}

/* ---------- lembar edit, toast, drop ---------- */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s}
.scrim.open{opacity:1;visibility:visible}
.sheet{
  position:fixed;z-index:21;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 32px));
  max-height:calc(100% - 40px);overflow-y:auto;border-radius:34px;padding:22px;display:flex;flex-direction:column;gap:14px;
  transform:translate(-50%,40px) scale(.94);opacity:0;visibility:hidden;
  transition:transform .6s cubic-bezier(.32,.72,0,1),opacity .35s,visibility .6s;
}
.sheet.open{transform:translate(-50%,0) scale(1);opacity:1;visibility:visible}
.sheet header{display:flex;align-items:center;gap:10px}
.sheet h2{margin:0;flex:1;font-size:22px;font-weight:800;letter-spacing:-.03em}
.sheet label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--fg2)}
.field{
  background:rgba(255,255,255,.1);border:1px solid var(--stroke);border-radius:16px;padding:11px 14px;outline:0;
  font-size:15px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--fg);width:100%;
}
.field:focus{border-color:var(--fg2);background:rgba(255,255,255,.16)}
textarea.field{min-height:190px;resize:vertical;line-height:1.5;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.row .pill{background:rgba(255,255,255,.14)}
.row .pill.main{background:var(--fg)}
.note{margin:0;font-size:12.5px;color:var(--fg2);line-height:1.5}
.toast{
  position:fixed;z-index:30;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-30px) scale(.9);
  padding:12px 20px;border-radius:24px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center;
  opacity:0;visibility:hidden;transition:transform .6s cubic-bezier(.32,.72,0,1),opacity .3s,visibility .6s;
}
.toast.open{transform:translate(-50%,0) scale(1);opacity:1;visibility:visible}
.drop{
  position:fixed;inset:14px;z-index:25;border-radius:40px;display:grid;place-items:center;text-align:center;font-size:22px;font-weight:800;letter-spacing:-.02em;
  opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;border:2px dashed var(--fg2);
}
.drop.open{opacity:1;visibility:visible}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- menyesuaikan ukuran layar ---------- */
:root{--tb:clamp(56px,8.6dvh,66px);--mh:clamp(56px,8.2dvh,64px);--gap:clamp(8px,1.6dvh,14px);--pad:clamp(10px,4vw,16px)}
body{padding-block:clamp(8px,1.6dvh,14px);padding-left:max(var(--pad),env(safe-area-inset-left,0px));padding-right:max(var(--pad),env(safe-area-inset-right,0px))}
.app{gap:var(--gap);--dock:calc(var(--tb) + var(--gap) + 10px)}
.app.has-mini{--dock:calc(var(--tb) + var(--gap) + var(--mh) + 18px)}
@media not all and (min-width:900px) and (min-height:560px){
  .app.fold,.app.fold.has-mini{--dock:calc(var(--tb) + var(--gap) + 10px)}
}
.panel{border-radius:clamp(24px,8vw,34px)}
.phead{padding:clamp(14px,2.6dvh,20px) clamp(16px,5vw,20px) 10px}
.phead h1,.phead h2{font-size:clamp(22px,6.6vw,26px)}
